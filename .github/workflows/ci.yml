name: cpu-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize locked environment
        # Keep the CPU quality job independent of the optional GPU-only
        # mamba-oracle group. That group builds mamba-ssm from source and
        # requires nvcc; the oracle has its own explicitly approved workflow.
        run: uv sync --frozen --group dev
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src tests
      - name: Test and enforce coverage
        run: uv run --frozen pytest
