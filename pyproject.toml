[project]
name = "lm-from-zero"
version = "0.1.0"
description = "Language-model training and inference from first principles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.0",
    "numpy==2.5.1",
    "polars==1.43.0",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "safetensors==0.8.0",
    "tensorboard==2.21.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "tqdm==4.69.0",
    "transformers==5.14.1",
    "typer==0.27.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.158.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]
mamba-oracle = [
    "mamba-ssm==2.3.2.post1",
]

[tool.uv]
no-build-isolation-package = ["mamba-ssm"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=lm_from_zero",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lm_from_zero"]
omit = [
    "src/lm_from_zero/post_training/sft_smoke.py",
    "src/lm_from_zero/post_training/sft_train.py",
    "src/lm_from_zero/post_training/sft_eval.py",
"src/lm_from_zero/post_training/dpo_smoke.py",
"src/lm_from_zero/post_training/dpo_train.py",
"src/lm_from_zero/post_training/preference_evaluation.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
